<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat with JestBot – your smart AI assistant by Jhuxtello iTech Solutions. Built for events, education, and business automation in Ghana." />
  <meta name="keywords" content="JestBot, Jhuxtello iTech, AI Chatbot, Ghana Software, Online Voting, School Management, Event Automation" />
  <meta name="author" content="Jhuxtello iTech Solutions" />
  <link rel="icon" href="https://jhuxtelloitech.com/wp-content/uploads/2024/09/jest.png" type="image/png" />
  <title>JestBot AI Chat – Powered by Jhuxtello iTech</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: linear-gradient(135deg, #ffffff, #f8f9ff, #eef5ff);
      background-size: 400% 400%;
      animation: bgMove 15s ease infinite;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #chatBox {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      width: 100%;
      margin: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      backdrop-filter: blur(10px);
      border-top: 6px solid #FD7407;
      position: relative;
      transition: all 0.4s ease;
    }

    .logo {
      text-align: center;
      padding: 20px 0 5px;
    }

    .logo img {
      width: 70px;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h2 {
      text-align: center;
      color: #001F3F;
      margin: 0;
      font-size: 22px;
      padding-bottom: 12px;
      letter-spacing: 0.5px;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #chatLog {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: transparent;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: msgFade 0.4s ease;
    }

    @keyframes msgFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      background-color: #FD7407;
      color: #fff;
      margin-left: auto;
      margin-right: 10px;
      text-align: right;
      border-bottom-right-radius: 0;
      box-shadow: 0 3px 8px rgba(253, 116, 7, 0.3);
    }

    .bot {
      background-color: #001F3F;
      color: #fff;
      margin-right: auto;
      margin-left: 10px;
      text-align: left;
      border-bottom-left-radius: 0;
      box-shadow: 0 3px 8px rgba(0, 31, 63, 0.3);
    }

    #inputArea {
      display: flex;
      align-items: center;
      border-top: 1px solid #ddd;
      padding: 12px;
      gap: 8px;
      background: #f9f9f9;
      position: relative;
    }

    #userInput {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid #ccc;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    #userInput:focus {
      border-color: #FD7407;
      box-shadow: 0 0 6px rgba(253, 116, 7, 0.3);
      outline: none;
    }

    #sendBtn, #micBtn {
      border: none;
      cursor: pointer;
      font-size: 18px;
      background: #FD7407;
      color: #fff;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    #micBtn { background: #001F3F; }
    #sendBtn:hover { background: #e55f00; transform: scale(1.05); }
    #micBtn:hover { background: #003366; transform: scale(1.05); }

    #typingIndicator {
      display: none;
      color: #888;
      font-style: italic;
      padding: 8px 16px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    footer {
      text-align: center;
      font-size: 13px;
      padding: 12px 10px;
      background: #fafafa;
      color: #666;
      border-top: 1px solid #ddd;
      animation: fadeIn 1s ease;
    }

    /* 🌙 Dark Mode */
    body.dark {
      background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
      color: #f1f1f1;
    }

    body.dark #chatBox {
      background: rgba(30,30,30,0.97);
      border-top-color: #ffa94d;
      box-shadow: 0 10px 25px rgba(255,169,77,0.05);
    }

    body.dark .user { background-color: #ffa94d; color: #000; }
    body.dark .bot { background-color: #2b2b2b; color: #fff; }
    body.dark #userInput { background-color: #2e2e2e; color: #fff; border-color: #444; }
    body.dark #inputArea { background-color: #1c1c1c; border-top-color: #333; }
    body.dark footer { background-color: #1a1a1a; color: #aaa; }

    #darkToggle {
      margin: 5px auto;
      padding: 6px 14px;
      font-size: 14px;
      background: linear-gradient(135deg, #001F3F, #FD7407);
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #darkToggle:hover { transform: scale(1.05); opacity: 0.9; }

    /* ⬇️ Scroll to bottom button */
    #scrollBtn {
      position: absolute;
      bottom: 80px;
      right: 25px;
      background: #FD7407;
      color: white;
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 20px;
      display: none;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    #scrollBtn:hover { background: #e55f00; transform: scale(1.1); }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div id="chatBox">
    <div class="logo">
      <img src="https://jhuxtelloitech.com/wp-content/uploads/2024/09/jest.png" alt="JestBot Logo">
    </div>
    <h2>💬 JestBot — Ask Me Anything</h2>

    <div style="text-align: center; margin-bottom: 10px;">
      <button id="darkToggle" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
    </div>

    <div id="typingIndicator">🧠 JestBot is typing...</div>
    <div id="chatLog"></div>

    <button id="scrollBtn" title="Scroll to bottom">⬇️</button>

    <div id="inputArea">
      <button id="micBtn" title="Speak" onclick="startListening()">🎤</button>
      <input type="text" id="userInput" placeholder="Ask a question..." />
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <footer>
    🤖 JestBot can make mistakes. Verify important info.<br>
    🔋 Powered by <strong>Team Jest</strong>.
  </footer>

  <audio id="typeSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_021f9b75c3.mp3?filename=keyboard-click-107974.mp3" preload="auto"></audio>

<script>
  const input = document.getElementById("userInput");
  const chatLog = document.getElementById("chatLog");
  const sendBtn = document.getElementById("sendBtn");
  const typingIndicator = document.getElementById("typingIndicator");
  const scrollBtn = document.getElementById("scrollBtn");
  const typeSound = document.getElementById("typeSound");

  function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    input.disabled = true;
    sendBtn.disabled = true;

    const userMsg = document.createElement("div");
    userMsg.className = "msg user";
    userMsg.innerText = msg;
    chatLog.appendChild(userMsg);
    chatLog.scrollTop = chatLog.scrollHeight;

    typingIndicator.style.display = "block";

    fetch("/get?msg=" + encodeURIComponent(msg))
      .then(res => res.text())
      .then(data => {
        typingIndicator.style.display = "none";

        const botMsg = document.createElement("div");
        botMsg.className = "msg bot";
        botMsg.innerHTML = marked.parse(data);
        chatLog.appendChild(botMsg);
        chatLog.scrollTop = chatLog.scrollHeight;

        // 🔊 Play typing sound
        typeSound.currentTime = 0;
        typeSound.play();

        input.value = "";
      })
      .catch(() => {
        typingIndicator.style.display = "none";
        alert("⚠️ Failed to get response.");
      })
      .finally(() => {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      });
  }

  document.addEventListener("DOMContentLoaded", () => {
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark");
    }
  });

  function toggleDarkMode() {
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark") ? "enabled" : "disabled");
  }

  // 🎤 Voice Recognition
  function startListening() {
    if (!('webkitSpeechRecognition' in window)) {
      alert("Voice input not supported.");
      return;
    }

    const recognition = new webkitSpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onresult = function (event) {
      const transcript = event.results[0][0].transcript;
      input.value = transcript;
      sendMessage();
    };

    recognition.onerror = function () {
      alert("Voice recognition error");
    };

    recognition.start();
  }

  // ⬇️ Scroll to bottom visibility
  chatLog.addEventListener("scroll", () => {
    const nearBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 100;
    scrollBtn.style.display = nearBottom ? "none" : "block";
  });

  scrollBtn.addEventListener("click", () => {
    chatLog.scrollTo({ top: chatLog.scrollHeight, behavior: "smooth" });
  });
</script>

</body>
</html>
