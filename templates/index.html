<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JestBot AI</title>
  <style>
    /* ---------- General Styles ---------- */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      height: 100vh;
      background: linear-gradient(135deg, #0f0f1f, #151530, #101030);
      color: #fff;
      overflow: hidden;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 260px;
      background: rgba(20, 20, 40, 0.8);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      padding: 20px;
      transition: all 0.3s;
    }
    .sidebar h2 {
      color: #fd7407;
      text-align: center;
      margin-bottom: 20px;
    }
    .sidebar button {
      background: #fd7407;
      border: none;
      padding: 10px;
      margin: 6px 0;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .sidebar button:hover { opacity: 0.8; }

    /* ---------- Chat Area ---------- */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      position: relative;
    }

    .chat-header {
      text-align: center;
      padding: 15px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fd7407;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 14px;
      max-width: 80%;
      line-height: 1.5;
      animation: fadeIn 0.3s ease-in;
    }
    .user {
      background: #fd7407;
      align-self: flex-end;
    }
    .bot {
      background: rgba(255,255,255,0.1);
      align-self: flex-start;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Input Area ---------- */
    .input-area {
      display: flex;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border-top: 1px solid rgba(255,255,255,0.1);
      gap: 10px;
    }
    input, select {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    button.send {
      background: #fd7407;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    button.send:hover { opacity: 0.8; }

    /* ---------- Theme ---------- */
    .light-mode {
      background: #f2f2f2;
      color: #222;
    }
    .light-mode .chat-header { background: #fff; color: #fd7407; }
    .light-mode .sidebar { background: #fff; color: #222; }
    .light-mode input { background: #eee; color: #222; }
    .light-mode .bot { background: #fff; color: #333; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>🧠 JestBot</h2>
    <button onclick="newChat()">+ New Chat</button>
    <button onclick="clearChat()">🧹 Clear Chat</button>
    <button onclick="exportPDF()">📄 Export</button>
    <button onclick="toggleTheme()">🌗 Toggle Theme</button>
    <hr style="border:1px solid rgba(255,255,255,0.1)">
    <label>Mode:</label>
    <select id="mode">
      <option value="chat">Chat</option>
      <option value="code">Code</option>
      <option value="assistant">Assistant</option>
    </select>
  </div>

  <div class="chat-container">
    <div class="chat-header">JestBot AI</div>
    <div id="messages" class="messages"></div>

    <div class="input-area">
      <input id="userInput" type="text" placeholder="Type your message..." onkeypress="if(event.key==='Enter'){sendMessage()}" />
      <button class="send" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const modeSelect = document.getElementById('mode');
    let isLight = false;

    function appendMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function botReply(userText) {
      const mode = modeSelect.value;
      let reply = "";
      if (mode === 'chat') reply = "🤖 I'm JestBot! Let's chat about anything.";
      else if (mode === 'code') reply = "💻 Coding Mode: I can help with PHP, Flutter, or MySQL.";
      else reply = "👋 Assistant Mode: Ask me about your projects or tasks!";
      typingEffect(reply);
    }

    function typingEffect(text) {
      let i = 0;
      const msg = document.createElement('div');
      msg.className = 'message bot';
      messagesDiv.appendChild(msg);

      const interval = setInterval(() => {
        msg.textContent += text.charAt(i);
        i++;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        if (i >= text.length) clearInterval(interval);
      }, 40);
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      appendMessage('user', text);
      input.value = '';
      setTimeout(() => botReply(text), 500);
    }

    function newChat() {
      messagesDiv.innerHTML = '';
      appendMessage('bot', "👋 Hello! I'm JestBot. How can I assist you today?");
    }

    function clearChat() {
      messagesDiv.innerHTML = '';
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      isLight = !isLight;
    }

    function exportPDF() {
      const content = messagesDiv.innerText;
      const blob = new Blob([content], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = "jestbot_chat.pdf";
      link.click();
    }

    // Start with welcome message
    newChat();
  </script>
</body>
</html>
