<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat with JestBot – your smart AI assistant by Jhuxtello iTech Solutions. Built for events, education, and business automation in Ghana." />
  <meta name="keywords" content="JestBot, Jhuxtello iTech, AI Chatbot, Ghana Software, Online Voting, School Management, Event Automation" />
  <meta name="author" content="Jhuxtello iTech Solutions" />
  <link rel="icon" href="https://jhuxtelloitech.com/wp-content/uploads/2024/09/jest.png" type="image/png" />
  <title>JestBot AI Chat – Powered by Jhuxtello iTech</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: 'Segoe UI', sans-serif; }

    body {
      display: flex;
      background: linear-gradient(135deg, #ffffff, #f7f8fc, #eef3ff);
      background-size: 300% 300%;
      animation: bgMove 20s infinite alternate ease;
      transition: background 0.5s, color 0.3s;
      overflow: hidden;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* Sidebar */
    #sidebar {
      width: 250px;
      background: #001f3f;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      z-index: 20;
    }

    #sidebar.hidden { width: 70px; }

    #sidebar .menu {
      padding: 20px 15px;
    }

    #sidebar button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: none;
      background: none;
      color: #fff;
      font-size: 15px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    #sidebar button:hover { background: rgba(255,255,255,0.1); }
    #sidebar.hidden button span { display: none; }

    #sidebar .footer {
      text-align: center;
      padding: 10px;
      font-size: 13px;
      opacity: 0.8;
    }

    /* Chat Section */
    #chatContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: background 0.3s ease;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.9);
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
      backdrop-filter: blur(6px);
      z-index: 5;
    }

    header img { width: 45px; border-radius: 50%; }
    header h2 { margin: 0; font-size: 18px; color: #001f3f; white-space: nowrap; }

    #toggleSidebar {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #FD7407;
    }

    #darkToggle {
      background: linear-gradient(135deg, #001F3F, #FD7407);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #darkToggle:hover { opacity: 0.9; }

    #chatLog {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
      word-wrap: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      background-color: #FD7407;
      color: white;
      margin-left: auto;
      text-align: right;
      border-bottom-right-radius: 0;
      box-shadow: 0 4px 10px rgba(253, 116, 7, 0.2);
    }

    .bot {
      background-color: #001F3F;
      color: white;
      margin-right: auto;
      border-bottom-left-radius: 0;
      box-shadow: 0 4px 10px rgba(0, 31, 63, 0.2);
    }

    #inputArea {
      display: flex;
      align-items: center;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: #fafafa;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid #ccc;
      font-size: 16px;
      transition: all 0.3s;
    }

    #userInput:focus {
      border-color: #FD7407;
      outline: none;
    }

    #sendBtn, #micBtn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    #sendBtn { background: #FD7407; }
    #micBtn { background: #001F3F; }

    #sendBtn:hover { background: #e55f00; }
    #micBtn:hover { background: #003366; }

    footer {
      text-align: center;
      font-size: 13px;
      padding: 10px;
      background: #f1f1f1;
      border-top: 1px solid #ddd;
      color: #333;
    }

    #typingIndicator {
      display: none;
      color: #666;
      font-style: italic;
      padding: 8px 16px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Dark Mode */
    body.dark {
      background: linear-gradient(135deg, #0d0d0d, #1c1c1c);
      color: #f1f1f1;
    }

    body.dark #chatContainer header {
      background: rgba(20,20,20,0.95);
      border-bottom-color: #333;
    }

    body.dark #chatContainer footer {
      background: #111;
      color: #bbb;
    }

    body.dark #inputArea {
      background: #181818;
      border-top-color: #333;
    }

    body.dark #userInput {
      background: #222;
      border-color: #444;
      color: #fff;
    }

    body.dark .bot {
      background: #2c2c2c;
      color: #fff;
    }

    body.dark .user {
      background: #ffa94d;
      color: #000;
    }

    body.dark #sidebar {
      background: #111;
      color: #eee;
    }

    body.dark #sidebar button:hover {
      background: rgba(255,255,255,0.08);
    }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        z-index: 50;
        height: 100%;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      #sidebar.show { transform: translateX(0); }

      #chatContainer {
        width: 100%;
      }

      header h2 {
        font-size: 15px;
        white-space: nowrap;
      }

      /* Overlay effect when sidebar is open */
      #overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
        z-index: 40;
      }

      #overlay.active {
        display: block;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="menu">
      <button onclick="newChat()">🆕 <span>New Chat</span></button>
      <button onclick="clearChat()">🧹 <span>Clear Chats</span></button>
      <button onclick="showAbout()">ℹ️ <span>About</span></button>
    </div>
    <div class="footer">
      <strong>JestBot</strong> © 2025<br>Jhuxtello iTech
    </div>
  </div>

  <!-- Overlay for mobile -->
  <div id="overlay" onclick="toggleSidebar()"></div>

  <!-- Chat Section -->
  <div id="chatContainer">
    <header>
      <button id="toggleSidebar" onclick="toggleSidebar()">☰</button>
      <h2 style="font-family: 'Poppins', sans-serif; 
           font-size: 28px; 
           font-weight: 700; 
           background: linear-gradient(90deg, #FD7407, #001F3F); 
           -webkit-background-clip: text; 
           -webkit-text-fill-color: transparent; 
           display: inline-block; 
           margin: 10px 0;">
  💬 JestBot – Smart AI Assistant
</h2>

      <button id="darkToggle" onclick="toggleDarkMode()">🌗</button>
    </header>

    <div id="chatLog"></div>
    <div id="typingIndicator">🧠 JestBot is thinking...</div>

    <div id="inputArea">
      <button id="micBtn" onclick="startListening()">🎤</button>
      <input type="text" id="userInput" placeholder="Ask me anything..." />
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <footer>
      🤖 JestBot may make mistakes — verify important info. <br>
      ⚡ Powered by <strong>Team Jest</strong>.
    </footer>
  </div>

  <audio id="typeSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_021f9b75c3.mp3?filename=keyboard-click-107974.mp3" preload="auto"></audio>

  <script>
    const input = document.getElementById("userInput");
    const chatLog = document.getElementById("chatLog");
    const typingIndicator = document.getElementById("typingIndicator");
    const typeSound = document.getElementById("typeSound");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;
      const userMsg = document.createElement("div");
      userMsg.className = "msg user";
      userMsg.innerText = msg;
      chatLog.appendChild(userMsg);
      input.value = "";
      chatLog.scrollTop = chatLog.scrollHeight;

      typingIndicator.style.display = "block";

      fetch("/get?msg=" + encodeURIComponent(msg))
        .then(res => res.text())
        .then(data => {
          typingIndicator.style.display = "none";
          const botMsg = document.createElement("div");
          botMsg.className = "msg bot";
          botMsg.innerHTML = marked.parse(data);
          chatLog.appendChild(botMsg);
          chatLog.scrollTop = chatLog.scrollHeight;
          typeSound.play();
        })
        .catch(() => {
          typingIndicator.style.display = "none";
          alert("⚠️ Failed to fetch response.");
        });
    }

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      localStorage.setItem("darkMode", document.body.classList.contains("dark") ? "enabled" : "disabled");
    }

    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark");
    }

    function toggleSidebar() {
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle("show");
        overlay.classList.toggle("active");
      } else {
        sidebar.classList.toggle("hidden");
      }
    }

    function newChat() {
      if (confirm("Start a new chat?")) chatLog.innerHTML = "";
    }

    function clearChat() {
      if (confirm("Clear all chat history?")) chatLog.innerHTML = "";
    }

    function showAbout() {
      alert("🤖 JestBot v2.1\nBuilt by Jhuxtello iTech Solutions (Ghana)\nEmpowering events, education & automation with AI.");
    }

    function startListening() {
      if (!('webkitSpeechRecognition' in window)) {
        alert("Voice recognition not supported.");
        return;
      }
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'en-US';
      recognition.onresult = e => {
        input.value = e.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    }
  </script>

</body>
</html>
